<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>NG Studio</title>
    <style>
      /* Shown the instant the app opens, before any code loads. Matches <Splash />. */
      html, body { margin: 0; background: #FFFFFF; }
      .boot { --mark: #000000; --track: #F3F3F3; --bar: #FF3D8B; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #000000; }
        .boot { --mark: #FFFFFF; --track: #262626; --bar: #FF4F97; }
      }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 22px; }
      .boot svg { animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-bar { width: 96px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--bar); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.96); opacity: 0.85; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="NG Studio">
        <!-- The studio's arch with the chikan flower; same drawing as src/components/ArchMark.tsx -->
        <svg width="84" height="126" viewBox="0 0 100 150" aria-hidden="true">
          <path fill="var(--mark)" d="M0 150V58A15 15 0 0 1 5 35A12.5 12.5 0 0 1 16 18A12 12 0 0 1 32 8A11.5 11.5 0 0 1 50 3A11.5 11.5 0 0 1 68 8A12 12 0 0 1 84 18A12.5 12.5 0 0 1 95 35A15 15 0 0 1 100 58V150Z" />
          <g transform="translate(50 72) scale(2.2)" fill="var(--bar)">
            <path d="M0 0c-4.5-3-5-9 0-12 5 3 4.5 9 0 12z" /><path d="M0 0c-4.5-3-5-9 0-12 5 3 4.5 9 0 12z" transform="rotate(72)" />
            <path d="M0 0c-4.5-3-5-9 0-12 5 3 4.5 9 0 12z" transform="rotate(144)" /><path d="M0 0c-4.5-3-5-9 0-12 5 3 4.5 9 0 12z" transform="rotate(216)" />
            <path d="M0 0c-4.5-3-5-9 0-12 5 3 4.5 9 0 12z" transform="rotate(288)" /><circle r="2" />
          </g>
        </svg>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
