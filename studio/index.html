<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E0F14" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>NG Studio</title>
    <style>
      /* Shown the instant the app opens, before any code loads. Matches <Splash />. */
      html, body { margin: 0; background: #FBF3F1; }
      .boot { --from: #B8336A; --to: #7E1E47; --track: #F7E9E8; --bar: #B02A5B; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1E0F14; }
        .boot { --from: #7A2148; --to: #45122A; --track: #3A2029; --bar: #F38BB0; }
      }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 22px; }
      .boot svg { animation: boot-pulse 1.6s ease-in-out infinite; filter: drop-shadow(0 12px 22px rgb(126 30 71 / 0.25)); }
      .boot-bar { width: 96px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--bar); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.96); opacity: 0.85; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="NG Studio">
        <!-- The studio's arch with a chikankari flower; same drawing as src/components/ArchMark.tsx -->
        <svg width="84" height="126" viewBox="0 0 100 150" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="0" y1="0" x2="0.6" y2="1">
              <stop offset="0" stop-color="var(--from)" /><stop offset="1" stop-color="var(--to)" />
            </linearGradient>
          </defs>
          <path fill="url(#boot-g)" d="M0 150V58A15 15 0 0 1 5 35A12.5 12.5 0 0 1 16 18A12 12 0 0 1 32 8A11.5 11.5 0 0 1 50 3A11.5 11.5 0 0 1 68 8A12 12 0 0 1 84 18A12.5 12.5 0 0 1 95 35A15 15 0 0 1 100 58V150Z" />
          <path fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="3.2 2.6" stroke-linecap="round" vector-effect="non-scaling-stroke" transform="translate(50 79) scale(0.86 0.9) translate(-50 -79)" d="M0 150V58A15 15 0 0 1 5 35A12.5 12.5 0 0 1 16 18A12 12 0 0 1 32 8A11.5 11.5 0 0 1 50 3A11.5 11.5 0 0 1 68 8A12 12 0 0 1 84 18A12.5 12.5 0 0 1 95 35A15 15 0 0 1 100 58V150Z" />
          <g transform="translate(50 70) scale(2.1)" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round">
            <path d="M0 0c-3-6-2-10 0-12 2 2 3 6 0 12z" /><path d="M0 0c-3-6-2-10 0-12 2 2 3 6 0 12z" transform="rotate(72)" />
            <path d="M0 0c-3-6-2-10 0-12 2 2 3 6 0 12z" transform="rotate(144)" /><path d="M0 0c-3-6-2-10 0-12 2 2 3 6 0 12z" transform="rotate(216)" />
            <path d="M0 0c-3-6-2-10 0-12 2 2 3 6 0 12z" transform="rotate(288)" /><circle r="1.6" fill="#fff" stroke="none" />
          </g>
        </svg>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
