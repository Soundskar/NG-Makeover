<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1C1B" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>NG Studio</title>
    <style>
      /* Shown the instant the app opens, before any code loads. Matches <Splash />. */
      html, body { margin: 0; background: #F6F5F3; }
      @media (prefers-color-scheme: dark) { html, body { background: #121110; } }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/favicon.svg" alt="NG Studio" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
